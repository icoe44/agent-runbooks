name: Build Registry Index

on:
  schedule:
    - cron: "17 3 * * *"   # daily, checks upstream drift too
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build registry
        run: python3 scripts/build_registry.py

      - name: Check upstream drift (mark stale)
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import json, yaml, urllib.request
          from pathlib import Path
          index = json.loads(Path("registry/index.json").read_text())
          for repo in index:
              try:
                  api = urllib.request.urlopen(f"https://api.github.com/repos/{repo}/releases/latest", timeout=10)
                  tag = json.load(api).get("tag_name")
              except Exception:
                  tag = None
              index[repo]["latest_known_upstream"] = tag
          Path("registry/index.json").write_text(json.dumps(index, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/index.json
          git diff --cached --quiet || (git commit -m "chore: rebuild registry + upstream drift check" && git push)
